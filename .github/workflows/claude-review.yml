name: Claude review

# Opt-in code review: runs only on non-draft PRs labelled `needs-review`
# (add the label to request a review; pushes to a labelled PR re-review it).
# Needs ONE repository secret:
#   CLAUDE_CODE_OAUTH_TOKEN  (run `claude setup-token` locally)  or  ANTHROPIC_API_KEY
# Without a secret the job is skipped, not failed, so it never blocks a merge by accident.

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened, labeled]

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

jobs:
  review:
    if: >-
      github.event.pull_request.draft == false &&
      contains(github.event.pull_request.labels.*.name, 'needs-review') &&
      (github.event.action != 'labeled' || github.event.label.name == 'needs-review')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Job-level, so a skipped run (another label added) never cancels a live review.
    concurrency:
      group: claude-review-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    env:
      HAS_CLAUDE_AUTH: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' || secrets.ANTHROPIC_API_KEY != '' }}
    steps:
      - name: Skip when no Claude credential is configured
        if: env.HAS_CLAUDE_AUTH != 'true'
        run: echo "::notice::Claude review skipped - add CLAUDE_CODE_OAUTH_TOKEN or ANTHROPIC_API_KEY under Settings > Secrets and variables > Actions."
      # Pinned to commit SHAs: these steps hold the Claude token, so a moved tag must not
      # be able to swap in new code. Bump deliberately.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        if: env.HAS_CLAUDE_AUTH == 'true'
        with:
          # Do not leave the GitHub token in .git/config where a prompted read could reach it.
          persist-credentials: false
      - uses: anthropics/claude-code-action@1d6de8cb0c237e7c15e9e1bdf973826ebae490cc  # v1
        if: env.HAS_CLAUDE_AUTH == 'true'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Review PR #${{ github.event.pull_request.number }} in ${{ github.repository }}.
            Follow .claude/CLAUDE.md. Use the claims-auditor agent definition in
            .claude/agents/claims-auditor.md as your checklist for public copy.
            Report, as inline comments plus one summary comment:
            - any new public claim the company cannot back (price, date, location,
              guarantee, response time, team size, client, certification, statistic)
            - anything that would break a page, the JSON-LD block, or the previews
            - anything that changes robots.txt, sitemap.xml, phone numbers or wa.me links
            Mark each finding blocking or nit. Do not approve or merge.
          claude_args: "--allowedTools Read,Grep,Glob,Bash(gh pr diff:*),Bash(gh pr view:*),mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*)"
